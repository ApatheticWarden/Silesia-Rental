services:
  silesia-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PID=Developer
    networks:
      - backend
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck: 
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-U", "${DB_USER}", "-P", "${MSSQL_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  silesia-api:
    build:
      context: .
      dockerfile: SilesiaRental/Dockerfile
    expose:
      - '8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=silesia-db;Database=${DB_NAME};User Id=${DB_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True;
    depends_on:
      silesia-db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  silesia-mvc:
    build:
      context: .
      dockerfile: SilesiaRental.MVC/Dockerfile
    expose: 
      - '8080'
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://silesia-api:8080
    depends_on:
      - silesia-api
    networks:
      - frontend

  nginx:
    image: nginx:latest
    container_name: silesia-proxy
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - silesia-mvc
    networks:
      - frontend

networks:
  frontend:
  backend:

volumes:
  mssql_data:
